<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="favicon-96.png">
<title>栖匣 · Logo 展示效果</title>
<style>
  :root{
    --paper:#f6f0e6; --ink:#5d4037; --sub:#8d6e63; --muted:#a8967f;
    --gold:#c5a35c; --line:#eadfc6;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Songti SC","Noto Serif CJK SC","STSong","SimSun",serif;
    background:var(--paper);
    background-image:radial-gradient(circle at 50% 0%, rgba(197,163,92,.07), transparent 60%);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:56px 24px;
  }
  .brand{
    width:100%; max-width:400px; display:flex; flex-direction:column;
    align-items:center; text-align:center;
  }
  /* 圆 logo 独立展示，无外层框 */
  .logo{
    width:172px; height:172px; flex:none;
    filter:drop-shadow(0 14px 28px rgba(93,64,55,.20));
    animation: float 5s ease-in-out infinite;
  }
  .logo img{ width:100%; height:100%; display:block; object-fit:contain; }
  @keyframes float{
    0%,100%{ transform:translateY(0) }
    50%{ transform:translateY(-7px) }
  }
  h1{
    margin-top:38px; font-size:44px; font-weight:700; color:var(--ink);
    letter-spacing:14px; text-indent:14px; text-shadow:0 1px 0 rgba(255,255,255,.55);
  }
  .sub{
    margin-top:14px; color:var(--sub); font-size:16px; letter-spacing:4px;
  }
  .rule{
    width:56px; height:2px; border-radius:2px; background:var(--gold);
    margin:26px auto; opacity:.85;
  }
  .slogan{
    color:var(--ink); font-size:21px; letter-spacing:5px; text-indent:5px;
  }
  .desc{
    margin-top:14px; color:var(--muted); font-size:14.5px; letter-spacing:1.5px;
  }
  .tag{
    margin-top:46px; padding-top:22px; border-top:1px dashed var(--line);
    display:flex; flex-wrap:wrap; gap:8px 16px; justify-content:center;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:12.5px; color:var(--sub); letter-spacing:.5px;
  }
  .tag span .ok{ color:#8aa36a; font-weight:700; margin-right:4px; }
</style>
</head>
<body>
  <div class="brand">
    <div class="logo"><img src="logo-chest.png" alt="栖匣 Logo"></div>
    <h1>栖匣</h1>
    <div class="sub">心有所栖 · 匣纳成长</div>
    <div class="rule"></div>
    <div class="slogan">收纳诸事，步履向前</div>
    <div class="desc">一只匣 · 安放你认真对待的每件事</div>
    <div class="tag">
      <span><span class="ok">✔</span>深棕 3D 木匣 · 三面可见</span>
      <span><span class="ok">✔</span>盒盖微启</span>
      <span><span class="ok">✔</span>金色锁扣</span>
      <span><span class="ok">✔</span>浅米色正圆底</span>
    </div>
  </div>
</body>
</html>
