<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>栖匣</title>
<script>
/* 栖匣 · 启动加载器 v2
   问题：GitHub Pages 对超大单文件存在传输截断（Content-Length 正确、实际只交付部分），
   1.7MB 单页一旦被截，主脚本（在文件末尾）无法到达 → 整页静默白屏。
   解决：index.html 仅作为极小的启动页，用 Range 分块（每块 180KB，远低于截断阈值）
   拉取 share.html，逐块校验长度并重试，拼装为完整字节后一次性解码并整页写入，
   从而在任意网络下都能完整加载，杜绝白屏；失败时给出可重试界面而非空白。
   安全说明：本加载器只获取并执行本站自身的 share.html，不读写用户数据。 */
(function () {
  var URL_BASE = 'share.html';
  var CHUNK = 180 * 1024;
  var TRIES = 3;

  function el(id) { return document.getElementById(id); }
  function setNote(t, isErr, pct) {
    var n = el('ld-note'), b = el('ld-bar');
    if (n) { n.textContent = t; n.style.color = isErr ? '#F3B49A' : 'rgba(255,255,255,.92)'; }
    if (b) b.style.width = Math.max(4, Math.min(100, pct || 100)) + '%';
  }
  function fail(msg) {
    setNote((msg || '加载失败，请检查网络') , true);
    var r = el('ld-retry'); if (r) r.style.display = 'inline-block';
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function tryWarmUp() { /* 预热连接 */ try { fetch(URL_BASE, { method: 'HEAD', cache: 'no-store' }).catch(function () {}); } catch (e) {} }

  /* 发起 Range 请求，返回 {buf, total}；total 从 Content-Range 解析（identity 表示长度） */
  function fetchRange(url, start, end) {
    return fetch(url, {
      headers: { 'Range': 'bytes=' + start + '-' + end, 'Accept-Encoding': 'identity', 'cache': 'no-store' },
    }).then(function (r) {
      if (r.status !== 206 && !r.ok) throw new Error('range ' + r.status);
      var total = null;
      var cr = r.headers.get('Content-Range') || '';
      var m = cr.match(/\/(\d+)\s*$/);
      if (m) total = +m[1];
      return r.arrayBuffer().then(function (buf) { return { buf: buf, total: total }; });
    });
  }

  /* 兜底：整段拉取（含 gzip），校验结尾，失败重试 */
  function fetchFull() {
    var t = 0;
    function once() {
      return fetch(URL_BASE, { cache: 'no-store' }).then(function (r) {
        if (!r.ok) throw new Error('http ' + r.status);
        return r.text().then(function (txt) {
          if (txt.length < 200000 || txt.indexOf('</html>') < 0) throw new Error('incomplete');
          return txt;
        });
      });
    }
    function loop() {
      return once().catch(function (err) {
        if (++t >= TRIES) throw err;
        return sleep(600 * t).then(loop);
      });
    }
    return loop();
  }

  async function run() {
    try {
      setNote('正在加载栖匣…', false, 4);
      tryWarmUp();
      var total = null, parts = [], first;
      try {
        first = await fetchRange(URL_BASE, 0, Math.min(CHUNK - 1, 100000));
        total = first.total;
      } catch (e) { total = null; }

      if (!total) {
        /* 服务端不支持 Content-Range → 退回整段拉取（含 gzip + 重试） */
        var fullTxt = await fetchFull();
        document.open(); document.write(fullTxt); document.close();
        return;
      }

      parts[0] = first.buf;
      var n = Math.ceil(total / CHUNK);
      for (var i = 1; i < n; i++) {
        var start = i * CHUNK, end = Math.min(total - 1, start + CHUNK - 1);
        var rest = null;
        for (var t = 0; t < TRIES; t++) {
          try {
            var r = await fetchRange(URL_BASE, start, end);
            if (r.buf.byteLength !== (end - start + 1)) throw new Error('short ' + r.buf.byteLength);
            rest = r.buf; break;
          } catch (e) { if (t < TRIES - 1) await sleep(500 * (t + 1)); }
        }
        if (!rest) { fail('分段下载中断（第 ' + (i + 1) + '/' + n + ' 段）'); return; }
        parts[i] = rest;
        setNote('正在加载栖匣… ' + Math.round((i + 1) / n * 100) + '%', false, (i + 1) / n * 100);
      }

      var len = 0, p;
      for (p = 0; p < parts.length; p++) len += parts[p].byteLength;
      var buf = new Uint8Array(len);
      var off = 0;
      for (p = 0; p < parts.length; p++) { buf.set(new Uint8Array(parts[p]), off); off += parts[p].byteLength; }
      var text = new TextDecoder('utf-8').decode(buf);
      setNote('正在初始化界面…', false, 100);
      document.open(); document.write(text); document.close();
    } catch (err) {
      fail('初始化异常，请重试');
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    var retry = el('ld-retry');
    if (retry) retry.onclick = function () { location.reload(); };
    /* 立即启动：即便脚本放 head 也能在 body 解析前开始，减少等待 */
    if (document.readyState === 'complete' || document.readyState === 'interactive') { run(); }
  });
})();
</script>
<style>
  html, body { height: 100%; margin: 0; background: #F5F1E6; }
  body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  #splash {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: linear-gradient(160deg, #2B2218, #4E3B29 55%, #6B4E2E);
  }
  .ld-logo {
    width: 78px; height: 78px; border-radius: 22px;
    background: rgba(255, 255, 255, .94); box-shadow: 0 12px 34px rgba(0, 0, 0, .38);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; color: #7A4E22;
  }
  .ld-bar { width: 176px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .22); overflow: hidden; }
  .ld-bar i { display: block; height: 100%; width: 4%; background: #E8C989; border-radius: 3px; transition: width .28s ease; }
  #ld-note { font-size: 13px; letter-spacing: .4px; color: rgba(255, 255, 255, .92); text-align: center; max-width: 260px; line-height: 1.6; }
  #ld-retry {
    display: none; margin-top: 4px; padding: 10px 26px; border-radius: 22px;
    background: #E8C989; color: #2B2218; border: none; font-size: 14px; font-weight: 600;
  }
</style>
</head>
<body>
  <div id="splash">
    <div class="ld-logo">栖</div>
    <div class="ld-bar"><i id="ld-bar"></i></div>
    <div id="ld-note">正在加载栖匣…</div>
    <button id="ld-retry">重新加载</button>
  </div>
</body>
</html>
