<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>栖匣</title>
<script>
/* 栖匣 · 启动加载器 v4（真机彻底修复加载失败）
   ─ 诊断结论（线上实测）────────────────────────────────────
   * share.html 全量下载：在用户手机网络上不稳定，会超时/被截断（曾 40s 只拿到尾部），
     反复整段重试治标不治本；
   * 多段 Range 分块（v2）：GitHub Pages CDN 在 2nd+ 段频繁回调失败（http=000）。
   ─ 本方案（v4）────────────────────────────────────────────
   发布时把 share.html 拆成许多 150KB 的小文件 qx-000.part … 与 manifest.json。
   小文件即使网络差也能各自带独立校验地稳定传输。加载器：
     1. 先拉 manifest.json 拿到分片总数与每片大小；
     2. 顺序/限并发拉取每个 .part，逐一核对 byteLength === 声明值，不匹配即单独重试该片；
     3. 全部收齐后按偏移拼接，做总长 + 首尾标记双重校验；
     4. 通过后才将完整内容注入页面；任一步最终失败给出「重新加载」按钮，绝不静默白屏。
   内容字节与 share.html 完全一致（已本地 MATCH 校验）。
   安全说明：本加载器只请求本站自身资源，不读写/上传任何用户数据。*/
(function () {
  var V = '2026.09.05.parts';
  var BASE = '';                       // 相对路径
  var MANIFEST = BASE + 'parts/manifest.json?v=' + V;
  var TRIES = 4;                       // 单片最大重试次数
  var CONCURRENCY = 3;                 // 限并发：3 个片同时下，兼顾稳定与速度

  function el(id) { return document.getElementById(id); }
  function setNote(t, isErr, pct) {
    var n = el('ld-note'), b = el('ld-bar');
    if (n) { n.textContent = t; n.style.color = isErr ? '#F3B49A' : 'rgba(255,255,255,.92)'; }
    if (b) b.style.width = Math.max(4, Math.min(100, pct || 100)) + '%';
  }
  function fail(msg) {
    setNote((msg || '加载失败，请检查网络（可点击重试）'), true);
    var r = el('ld-retry'); if (r) r.style.display = 'inline-block';
  }
  function sleep(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }

  function fetchBuf(url) {
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.arrayBuffer();
    });
  }

  /* 拉取单片，声明长度不符则重试 */
  function fetchPart(url, expect) {
    return new Promise(function (resolve, reject) {
      function attempt(t) {
        fetchBuf(url).then(function (ab) {
          if (!expect || ab.byteLength === expect) { resolve(ab); return; }
          throw new Error('short ' + ab.byteLength + '/' + expect);
        }).catch(function (e) {
          if (t < TRIES - 1) { setNote('重试中…', true, 10); setTimeout(function () { attempt(t + 1); }, 500 * (t + 1)); }
          else reject(e);
        });
      }
      attempt(0);
    });
  }

  async function run() {
    try {
      setNote('正在加载栖匣…', false, 8);
      var man = await fetchBuf(MANIFEST).then(function (ab) {
        return JSON.parse(new TextDecoder('utf-8').decode(ab));
      });
      var list = man.parts || man;               // 兼容数组结构
      var count = man.count || man.parts.length;
      var total = man.total;
      var segs = new Array(count);

      // 限并发下载
      var queue = list.map(function (p, i) {
        return { idx: i, url: BASE + 'parts/' + p.name + '?v=' + V, expect: p.size };
      });
      var cursor = 0;
      async function worker() {
        while (cursor < queue.length) {
          var it = queue[cursor++];
          var buf = await fetchPart(it.url, it.expect);
          segs[it.idx] = new Uint8Array(buf);
          // 进度
          var done = segs.filter(function (s) { return !!s; }).length;
          setNote('正在加载栖匣… ' + Math.round(done / count * 100) + '%', false, Math.max(12, Math.min(95, done / count * 100)));
        }
      }
      await Promise.all(Array.from({ length: Math.min(CONCURRENCY, count) }, worker));

      // 完整性：总长 + 首尾标记
      var len = 0, i;
      for (i = 0; i < count; i++) { if (!segs[i]) throw new Error('missing ' + i); len += segs[i].length; }
      if (total != null && len !== total) throw new Error('total ' + len + '/' + total);
      var buf = new Uint8Array(len);
      var off = 0;
      for (i = 0; i < count; i++) { buf.set(segs[i], off); off += segs[i].length; }
      var head = new TextDecoder('utf-8').decode(buf.subarray(0, 512));
      var tail = new TextDecoder('utf-8').decode(buf.subarray(len - 512));
      if (head.indexOf('<!DOCTYPE') !== 0) throw new Error('bad-head');
      if (tail.indexOf('</html>') < 0) throw new Error('bad-tail');

      setNote('正在初始化界面…', false, 100);
      var text = new TextDecoder('utf-8').decode(buf);
      document.open(); document.write(text); document.close();
    } catch (e) {
      fail();
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    var retry = el('ld-retry');
    if (retry) retry.onclick = function () { location.reload(); };
    if (document.readyState === 'complete' || document.readyState === 'interactive') { run(); }
  });
})();
</script>
<style>
  html, body { height: 100%; margin: 0; background: #F5F1E6; }
  body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  #splash {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: linear-gradient(160deg, #2B2218, #4E3B29 55%, #6B4E2E);
  }
  .ld-logo {
    width: 78px; height: 78px; border-radius: 22px;
    background: rgba(255, 255, 255, .94); box-shadow: 0 12px 34px rgba(0, 0, 0, .38);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; color: #7A4E22;
  }
  .ld-bar { width: 176px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .22); overflow: hidden; }
  .ld-bar i { display: block; height: 100%; width: 4%; background: #E8C989; border-radius: 3px; transition: width .28s ease; }
  #ld-note { font-size: 13px; letter-spacing: .4px; color: rgba(255, 255, 255, .92); text-align: center; max-width: 300px; line-height: 1.6; }
  #ld-retry {
    display: none; margin-top: 4px; padding: 10px 30px; border-radius: 22px;
    background: #E8C989; color: #2B2218; border: none; font-size: 14px; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
  <div id="splash">
    <div class="ld-logo">栖</div>
    <div class="ld-bar"><i id="ld-bar"></i></div>
    <div id="ld-note">正在加载栖匣…</div>
    <button id="ld-retry">重新加载</button>
  </div>
</body>
</html>
