<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>栖匣 · 新版Logo（圆形线圈·木匣）</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:radial-gradient(120% 90% at 50% 20%,#fffdf7,#f3ead8);min-height:100vh;
    padding:34px 22px 60px;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#4A3B2E}
  h1{font-size:20px;font-weight:800;margin-bottom:6px}
  .sub{color:#8a6d3b;font-size:13.5px;line-height:1.6;margin-bottom:26px}
  .card{background:#fff;border:1px solid #eedfb8;border-radius:20px;box-shadow:0 10px 26px rgba(93,64,55,.12);
    padding:26px;text-align:center}
  .card img{width:min(74vw,320px);height:auto;display:block;margin:0 auto;filter:drop-shadow(0 14px 24px rgba(93,64,55,.22))}
  .lbl{margin-top:16px;font-size:13px;color:#8a6d3b}
  .home{margin-top:22px;background:#fffdf8;border:1px solid #eedfb8;border-radius:18px;padding:16px;
    display:flex;align-items:center;gap:14px}
  .home img{width:60px;height:60px;flex:none}
  .home .t{font-size:21px;font-weight:800;letter-spacing:6px;color:#6e5430}
  .home .d{font-size:12px;color:#a08a58;margin-top:3px}
</style>
</head>
<body>
  <h1>栖匣 · 新版Logo（圆形线圈 &amp; 木匣）</h1>
  <div class="sub">已去掉外层深棕方框，只保留「圆形线圈＋里面的深棕木匣」，与参考图一致。<br>微信分享卡片可能走旧缓存，请看本页或直接打开主页刷新。</div>
  <div class="card">
    <img src="../pwa/logo-coil.png" alt="栖匣新logo">
    <div class="lbl">圆形线圈 · 里面是深棕木匣（金色锁扣）</div>
  </div>
  <div class="home">
    <img src="../pwa/logo-coil.png" alt="栖匣">
    <div><div class="t">栖匣</div><div class="d">心有所栖 · 匣纳成长</div></div>
  </div>
</body>
</html>
