<h1>全新主图标 · 开合匣</h1>
<p>去掉了原先那几道多余的横杠，只保留一条干净的开合匣轮廓：单线勾边、内容留白、一处暖金点睛在盒口。极简克制，小尺寸也清晰耐看。</p>
<div class="icon"><img src="../pwa/logo.png" alt="Centrove 主图标"></div>
<div class="note">
<b>设计说明</b><br>
· 单线轮廓 —— 无厚度双线、无多余横杠，干净利落<br>
· 暖金点睛 —— 只在盒口留一处金色边缘，克制而高级<br>
· 匣纳成长 —— 一只打开的匣，安放整个大学生活<br>
· 小尺寸清晰 —— 32px 应用图标下依然认得出
