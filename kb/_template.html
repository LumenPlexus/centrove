<!-- Generated by Trae Work -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#F5EDE0">
<title>知识库 · 栖匣</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FAF5EB;--card:#FFFDF6;--text:#3E2F1F;--muted:#7A6A55;--hint:#A89580;
  --primary:#5C4030;--primary-light:#EFE2D0;--primary-mid:#A08060;
  --teal:#3D6B5F;--teal-light:#E0EEE8;
  --coral:#B5533A;--coral-light:#F5DED4;
  --gold:#8C6128;--gold-light:#FBF1D8;
  --border:#E8DFCE;--border-strong:#D4C7AE;
  --radius:14px;--radius-sm:10px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1C1510;--card:#261D16;--text:#E8DFCE;--muted:#A89580;--hint:#7A6A55;
    --primary:#C9A87C;--primary-light:#3A2C1E;--primary-mid:#8B6F4E;
    --teal:#6BA89A;--teal-light:#1F332D;
    --coral:#D4876F;--coral-light:#3A2219;
    --border:#33281C;--border-strong:#4A3A28;
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;font-size:15px;padding-bottom:40px}
.header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px}
.back-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);cursor:pointer;font-size:18px;color:var(--text)}
.title{flex:1;font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.container{max-width:720px;margin:0 auto;padding:16px}
.kb-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
h1{font-size:22px;margin-bottom:6px;color:var(--primary)}
.subtitle{font-size:13px;color:var(--muted);margin-bottom:16px}
h2{font-size:17px;color:var(--primary);margin:20px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--primary-light)}
h3{font-size:15px;color:var(--text);margin:16px 0 8px}
p{margin-bottom:10px;color:var(--text)}
ul,ol{margin:8px 0 12px 24px}
li{margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
th{font-size:12px;color:var(--hint);font-weight:600;background:var(--bg)}
.callout{padding:12px 14px;border-radius:10px;margin:12px 0;font-size:14px;line-height:1.7}
.callout-info{background:var(--primary-light);border-left:3px solid var(--primary-mid)}
.callout-warn{background:var(--coral-light);border-left:3px solid var(--coral)}
.callout-ok{background:var(--teal-light);border-left:3px solid var(--teal)}
.callout strong{color:var(--text)}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.tag-teal{background:var(--teal-light);color:var(--teal)}
.tag-coral{background:var(--coral-light);color:var(--coral)}
.tag-blue{background:var(--primary-light);color:var(--primary)}
.toc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
.toc-title{font-weight:700;color:var(--primary);margin-bottom:8px;font-size:14px}
.toc a{display:block;padding:6px 10px;color:var(--muted);text-decoration:none;border-radius:8px;font-size:14px;margin-bottom:2px}
.toc a:hover{background:var(--primary-light);color:var(--primary)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
@media(max-width:500px){.grid-2{grid-template-columns:1fr}}
.back-top{position:fixed;right:16px;bottom:60px;width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:all .3s;z-index:90;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:16px}
.back-top.show{opacity:1}
.related{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.related h3{color:var(--muted);font-size:13px;font-weight:500;margin-bottom:10px}
.related-list{display:flex;gap:10px;flex-wrap:wrap}
.related-item{flex:1;min-width:140px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:10px;cursor:pointer;text-decoration:none;color:var(--text)}
.related-item:hover{border-color:var(--primary-mid)}
.related-item .ri-ico{font-size:20px;margin-bottom:4px}
.related-item .ri-title{font-size:13px;font-weight:600}
.related-item .ri-desc{font-size:11px;color:var(--muted);margin-top:2px}
</style>
</head>
<body>
<div class="header">
  <div class="back-btn" onclick="history.back()" title="返回">←</div>
  <div class="title" id="pageTitle">知识库</div>
</div>
<div class="container" id="content">
  <!-- 内容由各页面填充 -->
</div>
<div class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</div>
<script>
window.addEventListener('scroll',function(){
  var b=document.getElementById('backTop');
  if(window.scrollY>300){b.classList.add('show');}else{b.classList.remove('show');}
});
</script>
</body>
</html>
