<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="gRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6D9BF"/><stop offset="1" stop-color="#D3C2A0"/>
    </linearGradient>
    <linearGradient id="gInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F2E9"/><stop offset="1" stop-color="#F0E8D8"/>
    </linearGradient>
    <linearGradient id="gLid" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#9E713D"/><stop offset="1" stop-color="#885B2F"/>
    </linearGradient>
    <linearGradient id="gFront" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#774E24"/><stop offset="1" stop-color="#5D3D1D"/>
    </linearGradient>
    <linearGradient id="gRight" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#4E371F"/><stop offset="1" stop-color="#3C2A17"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5D688"/><stop offset="1" stop-color="#DFAF50"/>
    </linearGradient>
  </defs>

  <!-- 全出血品牌底色（maskable 由系统裁圆角） -->
  <rect x="0" y="0" width="96" height="96" fill="url(#gRing)"/>
  <rect x="10" y="10" width="76" height="76" rx="20" fill="url(#gInner)"/>

  <!-- 木匣（居中，安全区内） -->
  <g transform="translate(48,50) scale(0.82) translate(-54,-48.5)">
    <polygon points="28,42 70,42 80,31 38,31" fill="url(#gLid)"/>
    <polygon points="36,33 52,33 60,31 44,31" fill="#FFFFFF" opacity="0.12"/>
    <circle cx="54" cy="36.5" r="3.4" fill="url(#gGold)" stroke="#B98A35" stroke-width="0.6"/>
    <polygon points="28,42 70,42 70,66 28,66" fill="url(#gFront)"/>
    <circle cx="49" cy="54" r="4.4" fill="url(#gGold)" stroke="#B7872F" stroke-width="0.7"/>
    <circle cx="49" cy="54" r="2.4" fill="#8A6A2C"/>
    <path d="M28,42 L70,42 L80,31" fill="none" stroke="#2A1A0C" stroke-width="2" opacity="0.4"/>
    <polygon points="70,42 80,31 80,55 70,66" fill="url(#gRight)"/>
    <path d="M70,42 L70,66" fill="none" stroke="#241609" stroke-width="2.2" opacity="0.5"/>
  </g>
</svg>