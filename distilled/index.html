<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#6B4A2C">
<title>撷英匣 · 栖匣</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F2E8;--bg-soft:#EFE7D6;--card:#FFFFFF;--card-soft:#FDFBF4;
  --text:#3A2F23;--muted:#71685A;--hint:#A29380;
  --primary:#6B4A2C;--primary-light:#F1E7D4;--primary-mid:#A58352;
  --amber:#C07E2A;--amber-light:#F6E9D2;--amber-deep:#8F5F1F;
  --coral:#C05A3A;--coral-light:#FBE9E1;
  --border:#E9E0CB;--border-strong:#D8CAAC;
  --radius:16px;--radius-sm:10px;
  --shadow:0 1px 2px rgba(92,62,32,.06),0 6px 20px rgba(92,62,32,.07);
  --shadow-lg:0 12px 34px rgba(92,62,32,.14);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#211B13;--bg-soft:#1A1510;--card:#2C2419;--card-soft:#332A1D;
    --text:#EFE6D2;--muted:#B6AB95;--hint:#8A7E69;
    --primary:#D6B178;--primary-light:#3A2E1C;--primary-mid:#A58352;
    --amber:#E3A94E;--amber-light:#382A14;--amber-deep:#D99A3C;
    --coral:#E08A68;--coral-light:#3B2215;
    --border:#3A3022;--border-strong:#4E4230;
    --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 20px rgba(0,0,0,.25);
    --shadow-lg:0 12px 34px rgba(0,0,0,.4);
  }
}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.65;font-size:15px;padding-bottom:60px}
.header{position:sticky;top:0;z-index:100;background:rgba(247,242,232,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px}
@media(prefers-color-scheme:dark){.header{background:rgba(33,27,19,.9)}}
.back-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);cursor:pointer;font-size:18px;color:var(--primary);box-shadow:var(--shadow);text-decoration:none;flex-shrink:0}
.title{flex:1;font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--primary)}
.container{max-width:960px;margin:0 auto;padding:18px 16px}
.hero{text-align:center;padding:26px 0 6px;position:relative}
.hero h1{font-size:27px;color:var(--primary);margin-bottom:8px;font-weight:800;letter-spacing:.5px}
.hero h1 .hl{background:linear-gradient(120deg,var(--amber-deep),var(--coral));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero .subtitle{font-size:14px;color:var(--muted)}
.hero .subtitle b{color:var(--amber-deep)}
.search-box{margin:22px 0 16px;position:relative}
.search-box input{width:100%;padding:13px 18px 13px 46px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--text);font-size:15px;outline:none;transition:all .2s;box-shadow:var(--shadow)}
.search-box input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(192,126,42,.15)}
.search-box .search-ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.6}
.tabs{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:9px 16px;border-radius:22px;font-size:13px;background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .2s;font-weight:500}
.tab.active{background:linear-gradient(135deg,var(--primary),var(--amber-deep));color:#fff;border-color:transparent;box-shadow:var(--shadow)}
.tab:hover:not(.active){border-color:var(--amber);color:var(--primary);transform:translateY(-1px)}
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:768px){.card-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.card-grid{grid-template-columns:1fr}}
.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .22s;text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:9px;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--amber),var(--coral));opacity:0;transition:opacity .22s}
.card:hover{border-color:var(--amber);box-shadow:var(--shadow-lg);transform:translateY(-4px)}
.card:hover::before{opacity:1}
.card-head{display:flex;align-items:flex-start;gap:10px}
.card-icon{font-size:26px;line-height:1;flex-shrink:0;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--primary-light)}
.card-title{font-size:14.5px;font-weight:600;line-height:1.5;color:var(--text);flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-source{font-size:11px;color:var(--hint)}
.card-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.card-meta span{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:2px 8px}
.card-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600}
.tag-teal{background:var(--amber-light);color:var(--amber-deep)}
.tag-coral{background:var(--coral-light);color:var(--coral)}
.tag-blue{background:var(--primary-light);color:var(--primary)}
.card-summary{font-size:13px;color:var(--muted);line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-action{font-size:12px;color:var(--primary);font-weight:600;margin-top:auto;padding-top:4px;display:flex;align-items:center;gap:4px}
.card:hover .card-action{gap:8px;color:var(--amber-deep)}
.stats{text-align:center;margin-top:26px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--hint)}
.back-top{position:fixed;right:16px;bottom:90px;width:40px;height:40px;border-radius:50%;background:var(--card);color:var(--primary);border:1.5px solid var(--amber);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:all .3s;z-index:90;box-shadow:0 4px 14px rgba(0,0,0,.18);font-size:18px}
.back-top.show{opacity:1}
.empty-state{text-align:center;padding:46px 20px;color:var(--hint)}
.empty-state .emoji{font-size:42px;margin-bottom:10px}
.empty-state p{font-size:14px}</style>
</head>
<body>
<div class="header">
  <a class="back-btn" href="../index.html" title="返回栖匣">←</a>
  <div class="title">撷英匣</div>
</div>
<div class="container">
  <div class="hero">
    <h1>📚 <span class="hl">撷英匣</span></h1>
    <p class="subtitle">精选 <b>优质</b> 学习资源 · 结构化整理 · <b>勾选自测</b> · 点开就能用</p>
  </div>
  <div class="search-box">
    <span class="search-ico">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索资源标题、标签..." />
  </div>
  <div class="tabs" id="tabs">
    <div class="tab active" data-cat="all">全部</div>
    <div class="tab" data-cat="study">📚 学业学习</div>
    <div class="tab" data-cat="research">🔬 科研学术</div>
    <div class="tab" data-cat="tools">⚡ 效率工具</div>
    <div class="tab" data-cat="career">💼 职业发展</div>
  </div>
  <div class="card-grid" id="cardGrid"></div>
  <div class="stats" id="stats"></div>
</div>
<div class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</div>
<script>
let allResources = [];
let currentCat = 'all';
let searchKw = '';

function getTagClass(i){
  const classes = ['tag-teal','tag-coral','tag-blue'];
  return classes[i % classes.length];
}

function renderCards(){
  const grid = document.getElementById('cardGrid');
  const stats = document.getElementById('stats');
  
  let filtered = allResources.filter(r => {
    if(currentCat !== 'all' && r.category !== currentCat) return false;
    if(searchKw){
      const kw = searchKw.toLowerCase();
      const titleMatch = r.title.toLowerCase().includes(kw);
      const tagMatch = r.tags.some(t => t.toLowerCase().includes(kw));
      if(!titleMatch && !tagMatch) return false;
    }
    return true;
  });

  if(filtered.length === 0){
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="emoji">🔍</div><p>没有找到匹配的资源，换个关键词试试？</p></div>';
    stats.textContent = '共 0 条结果';
    return;
  }

  grid.innerHTML = filtered.map(r => {
    const catIcons = {study:'📚', research:'🔬', tools:'⚡', career:'💼'};
    const tagsHtml = r.tags.slice(0,3).map((t,i) => '<span class="tag '+getTagClass(i)+'">'+t+'</span>').join('');
    return '<a class="card" href="'+r.id+'.html" onclick="beforeEnterDetail()">'+
      '<div class="card-head">'+
        '<div class="card-icon">'+(catIcons[r.category] || '📄')+'</div>'+
        '<div style="flex:1;min-width:0"><div class="card-title">'+r.title+'</div></div>'+
      '</div>'+
      '<div class="card-source">'+r.source+'</div>'+
      '<div class="card-meta">'+
        '<span>'+r.difficulty+'</span>'+
        '<span>'+r.timeCost+'</span>'+
      '</div>'+
      '<div class="card-tags">'+tagsHtml+'</div>'+
      '<div class="card-summary">'+r.summary+'</div>'+
      '<div class="card-action">查看详情 →</div>'+
    '</a>';
  }).join('');

  stats.textContent = '共 '+filtered.length+' 条资源 · 更新于 2026-09-16';
}

document.getElementById('tabs').addEventListener('click', function(e){
  var tab = e.target.closest('.tab');
  if(!tab) return;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  tab.classList.add('active');
  currentCat = tab.dataset.cat;
  renderCards();
});

var searchTimer;
document.getElementById('searchInput').addEventListener('input', function(e){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function(){
    searchKw = e.target.value.trim();
    renderCards();
  }, 200);
});

window.addEventListener('scroll', function(){
  var b = document.getElementById('backTop');
  if(window.scrollY > 300){b.classList.add('show');}else{b.classList.remove('show');}
});

/* 记录「来源页」：从首页/外部进入后，返回键能回到进入前的位置 */
try{ sessionStorage.setItem('distilled_from','1'); }catch(e){}

/* 返回撷英匣页时，若从详情页 back 回来，恢复之前的分类、搜索和滚动位置 */
var DL_KEY='distilled_state_v1';
function saveDLState(){
  try{
    sessionStorage.setItem(DL_KEY, JSON.stringify({
      cat: currentCat, kw: searchKw, scroll: window.scrollY||document.documentElement.scrollTop||0
    }));
  }catch(e){}
}
function restoreDLState(){
  try{
    var s = JSON.parse(sessionStorage.getItem(DL_KEY)||'null');
    if(s){
      if(s.cat && document.querySelector('.tab[data-cat="'+s.cat+'"]')){
        currentCat = s.cat;
        document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active', t.dataset.cat===s.cat);});
      }
      if(s.kw){ searchKw = s.kw; var inp=document.getElementById('searchInput'); if(inp) inp.value = s.kw; }
      return s.scroll || 0;
    }
  }catch(e){}
  return 0;
}
function applyDLScroll(scrollTop){
  if(scrollTop && scrollTop>0){
    setTimeout(function(){window.scrollTo(0,scrollTop);}, 60);
    setTimeout(function(){window.scrollTo(0,scrollTop);}, 350);
  }
}
window.addEventListener('scroll', function(){ saveDLState(); });

/* 记录离开撷英匣时的状态（点击卡片进详情前），供返回时恢复 */
function beforeEnterDetail(){
  saveDLState();
}

fetch('index.json')
  .then(function(res){return res.json()})
  .then(function(data){
    allResources = data.resources;
    var savedScroll = restoreDLState();
    renderCards();
    applyDLScroll(savedScroll);
  })
  .catch(function(err){
    document.getElementById('cardGrid').innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--coral)">加载失败，请刷新重试</p>';
  });
</script>
</body>
</html>
