<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#F5EDE0">
<title>资源蒸馏库 · 栖匣</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FAF5EB;--card:#FFFDF6;--text:#3E2F1F;--muted:#7A6A55;--hint:#A89580;
  --primary:#5C4030;--primary-light:#EFE2D0;--primary-mid:#A08060;
  --teal:#3D6B5F;--teal-light:#E0EEE8;
  --coral:#B5533A;--coral-light:#F5DED4;
  --border:#E8DFCE;--border-strong:#D4C7AE;
  --radius:14px;--radius-sm:10px;
  --shadow:0 2px 8px rgba(92,64,48,.08);
  --shadow-hover:0 4px 16px rgba(92,64,48,.12);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1C1510;--card:#261D16;--text:#E8DFCE;--muted:#A89580;--hint:#7A6A55;
    --primary:#C9A87C;--primary-light:#3A2C1E;--primary-mid:#8B6F4E;
    --teal:#6BA89A;--teal-light:#1F332D;
    --coral:#D4876F;--coral-light:#3A2219;
    --border:#33281C;--border-strong:#4A3A28;
    --shadow:0 2px 8px rgba(0,0,0,.2);
    --shadow-hover:0 4px 16px rgba(0,0,0,.3);
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.65;font-size:15px;padding-bottom:60px}
.header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px}
.back-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);cursor:pointer;font-size:18px;color:var(--text);text-decoration:none;flex-shrink:0}
.title{flex:1;font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.container{max-width:960px;margin:0 auto;padding:16px}
.hero{text-align:center;padding:20px 0 8px}
.hero h1{font-size:24px;color:var(--primary);margin-bottom:4px}
.hero .subtitle{font-size:13px;color:var(--muted)}
.search-box{margin:20px 0 16px;position:relative}
.search-box input{width:100%;padding:12px 16px 12px 42px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--text);font-size:15px;outline:none;transition:border-color .2s}
.search-box input:focus{border-color:var(--primary-mid)}
.search-box .search-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.6}
.tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:8px 14px;border-radius:20px;font-size:13px;background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .2s}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.tab:hover:not(.active){border-color:var(--primary-mid);color:var(--primary)}
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:768px){.card-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.card-grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .2s;text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:8px}
.card:hover{border-color:var(--primary-mid);box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.card-head{display:flex;align-items:flex-start;gap:10px}
.card-icon{font-size:24px;line-height:1;flex-shrink:0}
.card-title{font-size:14px;font-weight:600;line-height:1.45;color:var(--text);flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-source{font-size:11px;color:var(--hint)}
.card-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.card-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.tag-teal{background:var(--teal-light);color:var(--teal)}
.tag-coral{background:var(--coral-light);color:var(--coral)}
.tag-blue{background:var(--primary-light);color:var(--primary)}
.card-summary{font-size:13px;color:var(--muted);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-action{font-size:12px;color:var(--primary);font-weight:500;margin-top:auto;padding-top:4px}
.card:hover .card-action{text-decoration:underline}
.stats{text-align:center;margin-top:24px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--hint)}
.back-top{position:fixed;right:16px;bottom:90px;width:38px;height:38px;border-radius:50%;background:var(--card);color:var(--primary);border:1.5px solid var(--primary-mid);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:all .3s;z-index:90;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:16px}
.back-top.show{opacity:1}
.empty-state{text-align:center;padding:40px 20px;color:var(--hint)}
.empty-state .emoji{font-size:40px;margin-bottom:8px}
.empty-state p{font-size:14px}
</style>
</head>
<body>
<div class="header">
  <a class="back-btn" href="../index_preview.html" title="返回栖匣">←</a>
  <div class="title">资源蒸馏库</div>
</div>
<div class="container">
  <div class="hero">
    <h1>📚 资源蒸馏库</h1>
    <p class="subtitle">精选优质学习资源 · 结构化整理 · 点开就能用</p>
  </div>
  <div class="search-box">
    <span class="search-ico">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索资源标题、标签..." />
  </div>
  <div class="tabs" id="tabs">
    <div class="tab active" data-cat="all">全部</div>
    <div class="tab" data-cat="study">📚 学业学习</div>
    <div class="tab" data-cat="research">🔬 科研学术</div>
    <div class="tab" data-cat="tools">⚡ 效率工具</div>
    <div class="tab" data-cat="career">💼 职业发展</div>
  </div>
  <div class="card-grid" id="cardGrid"></div>
  <div class="stats" id="stats"></div>
</div>
<div class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</div>
<script>
let allResources = [];
let currentCat = 'all';
let searchKw = '';

function getTagClass(i){
  const classes = ['tag-teal','tag-coral','tag-blue'];
  return classes[i % classes.length];
}

function renderCards(){
  const grid = document.getElementById('cardGrid');
  const stats = document.getElementById('stats');
  
  let filtered = allResources.filter(r => {
    if(currentCat !== 'all' && r.category !== currentCat) return false;
    if(searchKw){
      const kw = searchKw.toLowerCase();
      const titleMatch = r.title.toLowerCase().includes(kw);
      const tagMatch = r.tags.some(t => t.toLowerCase().includes(kw));
      if(!titleMatch && !tagMatch) return false;
    }
    return true;
  });

  if(filtered.length === 0){
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="emoji">🔍</div><p>没有找到匹配的资源，换个关键词试试？</p></div>';
    stats.textContent = '共 0 条结果';
    return;
  }

  grid.innerHTML = filtered.map(r => {
    const catIcons = {study:'📚', research:'🔬', tools:'⚡', career:'💼'};
    const tagsHtml = r.tags.slice(0,3).map((t,i) => '<span class="tag '+getTagClass(i)+'">'+t+'</span>').join('');
    return '<a class="card" href="'+r.id+'.html">'+
      '<div class="card-head">'+
        '<div class="card-icon">'+(catIcons[r.category] || '📄')+'</div>'+
        '<div style="flex:1;min-width:0"><div class="card-title">'+r.title+'</div></div>'+
      '</div>'+
      '<div class="card-source">'+r.source+'</div>'+
      '<div class="card-meta">'+
        '<span>'+r.difficulty+'</span>'+
        '<span>'+r.timeCost+'</span>'+
      '</div>'+
      '<div class="card-tags">'+tagsHtml+'</div>'+
      '<div class="card-summary">'+r.summary+'</div>'+
      '<div class="card-action">查看详情 →</div>'+
    '</a>';
  }).join('');

  stats.textContent = '共 '+filtered.length+' 条资源 · 更新于 2026-09-16';
}

document.getElementById('tabs').addEventListener('click', function(e){
  var tab = e.target.closest('.tab');
  if(!tab) return;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  tab.classList.add('active');
  currentCat = tab.dataset.cat;
  renderCards();
});

var searchTimer;
document.getElementById('searchInput').addEventListener('input', function(e){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function(){
    searchKw = e.target.value.trim();
    renderCards();
  }, 200);
});

window.addEventListener('scroll', function(){
  var b = document.getElementById('backTop');
  if(window.scrollY > 300){b.classList.add('show');}else{b.classList.remove('show');}
});

fetch('index.json')
  .then(function(res){return res.json()})
  .then(function(data){
    allResources = data.resources;
    renderCards();
  })
  .catch(function(err){
    document.getElementById('cardGrid').innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--coral)">加载失败，请刷新重试</p>';
  });
</script>
</body>
</html>
